name: Wyniki PKW na żywo

# Checks PKW every 30 seconds and republishes data/results.json whenever more
# commissions are counted, until PKW has counted all of them.
#
# Start it by hand: Actions → "Wyniki PKW na żywo" → Run workflow.
# The Kraków file is already the default (4485.blob). A repository variable
# PKW_URL replaces it. The schedule starts at 20:50 on Sunday 11 October
# (18:50 UTC). Commits are made as Adam, like every other commit.

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Adres danych PKW (puste = plik Krakowa 4485.blob)"
        required: false
        default: "https://wybory.gov.pl/wojtburmistrz_2024_2029/data/details/4485.blob"
      interval:
        description: "Co ile sekund sprawdzać"
        default: "30"
  schedule:
    - cron: "50 18 11 10 *"

permissions:
  contents: write
  pages: write

concurrency:
  group: pkw-live
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Commit as Adam
        run: |
          git config user.name "Adam"
          git config user.email "97188913+MarkockiAdam@users.noreply.github.com"

      - name: Watch PKW
        env:
          PKW_URL: ${{ inputs.url || vars.PKW_URL || 'https://wybory.gov.pl/wojtburmistrz_2024_2029/data/details/4485.blob' }}
          PKW_INTERVAL: ${{ inputs.interval || '30' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/pkw-watch.mjs --push --max-hours 5.7
